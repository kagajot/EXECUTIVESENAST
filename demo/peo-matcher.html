<title>PEO Assistive Matcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-sized app (bottom tabs, pushed pages) centred on white. On a real phone it fills the screen. */
:root{
  --bg:#FFFFFF; --surface:#F5F6FA; --ink:#1B2235; --muted:#626B85; --line:#E9EBF2; --accent:#3D5AF1; --accent-ink:#FFFFFF; --accent-soft:#E9EDFF;
  --ok:#1E8E5A; --ok-bg:#DDF3E8; --warn:#9A6200; --warn-bg:#FCEBC7; --bad:#B3261E; --bad-bg:#FBDCD9; --shadow:0 18px 50px rgba(27,34,53,.10);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.12} h2{font-size:19px} h3{font-size:16px}
.mono{font-family:var(--f-mono);font-size:11px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

.stage{height:100%;display:grid;place-items:center;padding:20px}
.app{position:relative;width:100%;max-width:410px;height:min(100%,860px);background:var(--bg);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:520px){.stage{padding:0;display:block}.app{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}}

.bar[hidden]{display:none}
.bar{display:flex;align-items:center;gap:8px;padding:14px 12px 6px;flex:none}
.bar h2{flex:1;text-align:center;font-size:16px;padding-right:40px}
.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px;min-height:0;scrollbar-width:thin}
.bar:not([hidden])+main{padding-top:10px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted)}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;color:var(--muted);font-size:11px;cursor:pointer;position:relative;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg)}
.search svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;outline:0}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* category cards: kept from v1 */
.cards{display:flex;flex-direction:column;gap:12px}
.card{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:84px;padding:0 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;font:inherit;width:100%}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.card::before{width:98px;height:98px;right:-18px;top:-24px} .card::after{width:46px;height:46px;right:54px;top:42px;background:rgba(255,255,255,.2)}
.card b{font-family:var(--f-display);font-size:18px;position:relative} .card span{position:relative;font-size:13px;opacity:.85}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.985)}.page{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}}

.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:16px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px;cursor:pointer;border:0;text-align:left;width:100%}
.notice.safe{background:var(--ok-bg);color:var(--ok)}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;border:0;background:var(--surface);border-radius:18px;padding:12px;text-align:left;cursor:pointer;width:100%}
.tile{position:relative;flex:none;width:54px;height:54px;border-radius:16px;overflow:hidden}
.tile::before{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.35);right:-8px;top:-8px}
.tile::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);left:10px;bottom:9px}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.item .txt b{font-family:var(--f-display);font-size:16px}
.item .txt span{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:2px 8px;background:var(--surface);color:var(--muted);font-weight:500}
.item .tag{background:var(--bg)}
.tag.sev-high{background:var(--bad-bg);color:var(--bad)} .tag.sev-moderate{background:var(--warn-bg);color:var(--warn)} .tag.best{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.hard{background:var(--bad-bg);color:var(--bad);font-family:var(--f-mono)} .tag.unconfirmed{background:var(--warn-bg);color:var(--warn);font-family:var(--f-mono)} .tag.preference{font-family:var(--f-mono)}
.row2{display:flex;flex-wrap:wrap;gap:6px}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::before{width:150px;height:150px;right:-30px;top:-40px} .hero::after{width:70px;height:70px;right:90px;top:70px;background:rgba(255,255,255,.2)}
.hero *{position:relative} .hero h1{font-size:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.check.warn i{background:var(--warn-bg);color:var(--warn)}
.meter{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.meter .bar2{height:6px;border-radius:9px;background:var(--surface);overflow:hidden}.meter .bar2 i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter .mono{text-align:right}
.box{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}

.empty{background:var(--surface);border-radius:18px;padding:18px;color:var(--muted);text-align:center}
.reason{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.blocked{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.blocked .reason{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:baseline}
.ask{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px 14px}
.ask b{display:block;font-weight:700}.ask span{font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;flex:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.rowlink:first-child{border-top:0}
.rowlink small{color:var(--muted);display:block}
.rowlink svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
select.sel{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:0;border-radius:14px;padding:13px 14px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.risk[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pill.env[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.env.forb[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cap{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(27,34,53,.15)}
.seg button.na[aria-pressed=true]{color:var(--warn)}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px}
.toggle{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed=true]{background:var(--accent)} .toggle[aria-pressed=true]::after{transform:translateX(20px)}
</style>

<div class="stage">
  <div class="app" id="app">
    <div class="bar" id="bar" hidden>
      <button class="iconbtn" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="barTitle"></h2>
    </div>
    <main id="view"></main>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>
</div>

<script>
// Vocabulary validation.
//
// Why this exists: a misspelled tag in `forbids_any` or `contraindicated_if_any`
// would never match anything, silently disabling a safety filter. Likewise a
// misspelled risk flag on a person profile would silently skip a contraindication.
// So every tag / dimension / task id is checked against the taxonomy and any
// unknown value is a hard error, not a warning.

class ValidationError extends Error {
  constructor(errors) {
    super(`Validation failed:\n - ${errors.join('\n - ')}`);
    this.name = 'ValidationError';
    this.errors = errors;
  }
}

const SEVERITIES = ['none', 'low', 'moderate', 'high'];
const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

function normalizeDemand(d) {
  return typeof d === 'number' ? { min: d, critical: false } : { min: d.min, critical: !!d.critical };
}

function validateCatalog(tools, tax) {
  const errs = [];
  const seen = new Set();
  const dims = tax.dimensions, cats = tax.categories.map((c) => c.id);
  const check = (tool, label, values, vocab) => {
    for (const v of values ?? []) if (!(v in vocab)) errs.push(`${tool.id}: unknown ${label} "${v}"`);
  };
  for (const t of tools) {
    if (seen.has(t.id)) errs.push(`duplicate tool id "${t.id}"`);
    seen.add(t.id);
    if (!cats.includes(t.category)) errs.push(`${t.id}: unknown category "${t.category}"`);
    if (!t.addresses?.length) errs.push(`${t.id}: must address at least one task`);
    check(t, 'task', t.addresses, tax.tasks);
    check(t, 'chip tag', t.tags, tax.chips);
    check(t, 'risk flag (contraindicated_if_any)', t.contraindicated_if_any, tax.risk_flags);
    check(t, 'environment tag (requires_all)', t.environment?.requires_all, tax.environment_tags);
    check(t, 'environment tag (forbids_any)', t.environment?.forbids_any, tax.environment_tags);
    check(t, 'tech tag (daily_use)', t.tech?.daily_use, tax.tech_tags);
    check(t, 'tech tag (setup)', t.tech?.setup, tax.tech_tags);
    for (const [dim, raw] of Object.entries(t.demands ?? {})) {
      if (!(dim in dims)) { errs.push(`${t.id}: unknown demand dimension "${dim}"`); continue; }
      const d = normalizeDemand(raw);
      if (!isInt(d.min, 1, 4)) errs.push(`${t.id}: demand ${dim}.min must be an integer 1-4`);
    }
    for (const s of t.supervised_if_below ?? []) {
      if (!(s.dimension in dims)) errs.push(`${t.id}: unknown supervised_if_below dimension "${s.dimension}"`);
      if (!isInt(s.level, 1, 4)) errs.push(`${t.id}: supervised_if_below level must be 1-4`);
    }
    if (!SEVERITIES.includes(t.hazards?.severity)) errs.push(`${t.id}: hazards.severity must be one of ${SEVERITIES}`);
    if (!isInt(t.cost_band, 0, 3)) errs.push(`${t.id}: cost_band must be 0-3`);
    if (!isInt(t.complexity, 0, 3)) errs.push(`${t.id}: complexity must be 0-3`);
    if (!isInt(t.learning_burden, 0, 3)) errs.push(`${t.id}: learning_burden must be 0-3`);
    // A tool that shares tags across both lists would be unsatisfiable - almost certainly a data error.
    const both = (t.environment?.requires_all ?? []).filter((x) => (t.environment?.forbids_any ?? []).includes(x));
    if (both.length) errs.push(`${t.id}: environment tag(s) both required and forbidden: ${both}`);
  }
  if (errs.length) throw new ValidationError(errs);
}

function validateProfile(profile, tax) {
  const errs = [];
  const { person, environment, occupation } = profile ?? {};
  if (!person || !environment || !occupation) {
    throw new ValidationError(['profile must contain person, environment and occupation (PEO)']);
  }
  for (const [dim, v] of Object.entries(person.capacities ?? {})) {
    if (!(dim in tax.dimensions)) errs.push(`person.capacities: unknown dimension "${dim}"`);
    else if (v !== null && v !== undefined && !isInt(v, 0, 4)) errs.push(`person.capacities.${dim} must be integer 0-4 or null`);
  }
  for (const f of person.risk_flags ?? []) if (!(f in tax.risk_flags)) errs.push(`person.risk_flags: unknown flag "${f}"`);
  for (const t of person.tech_literacy ?? []) if (!(t in tax.tech_tags)) errs.push(`person.tech_literacy: unknown tag "${t}"`);
  for (const t of environment.confirmed_tags ?? []) if (!(t in tax.environment_tags)) errs.push(`environment.confirmed_tags: unknown tag "${t}"`);
  for (const g of occupation.goals ?? []) if (!(g in tax.tasks)) errs.push(`occupation.goals: unknown task "${g}"`);
  const q = occupation.query ?? {};
  if (q.category && !tax.categories.some((c) => c.id === q.category)) errs.push(`occupation.query.category: unknown "${q.category}"`);
  for (const c of q.chips ?? []) if (!(c in tax.chips)) errs.push(`occupation.query.chips: unknown chip "${c}"`);
  if (person.budget_band !== undefined && !isInt(person.budget_band, 0, 3)) errs.push('person.budget_band must be 0-3');
  if (typeof person.risk_screening_complete !== 'boolean') errs.push('person.risk_screening_complete must be an explicit boolean');
  if (errs.length) throw new ValidationError(errs);
}

// PEO matching engine: Person x Environment x Occupation -> assistive tools / workarounds.
//
// Pipeline:  validate -> relevance -> HARD GATES -> query filter -> rank -> browse view
//
// Invariants (enforced by test/invariants.test.mjs):
//   I1  A tool is recommended only if it passes EVERY gate. Ranking, categories, chips and
//       search can only remove candidates, never add or rescue one.
//   I2  Fail-closed: an unassessed capacity, an unconfirmed environment/tech tag or an
//       incomplete risk screening is treated as a failure, never as a pass.
//   I3  The engine has no "override", "relax" or "show anyway" path.
//
// Purpose is compensation / adaptation. Nothing here scores or suggests rehabilitation.



const ENGINE_VERSION = '0.1.0';

const DEFAULTS = Object.freeze({
  // Production must keep this true: draft (unreviewed) catalogue entries are not recommended.
  requireClinicalReview: true,
  // Extra capacity margin demanded on `critical` dimensions, by hazard severity.
  safetyMargin: { none: 0, low: 0, moderate: 0, high: 1 },
  enforceBudget: true,
  featuredN: 3,
});

// Failure kinds:
//   hard        - person/environment demonstrably cannot support the tool. Never recoverable by asking more.
//   unconfirmed - we lack information. Still excluded; answering the question may make it eligible.
//   preference  - not a safety issue (budget).
const F = (gate, code, kind, detail, extra = {}) => ({ gate, code, kind, detail, ...extra });

// ---------------------------------------------------------------- gates

function evaluateGates(tool, profile, opts = DEFAULTS) {
  const { person, environment } = profile;
  const caps = person.capacities ?? {};
  const envTags = new Set(environment.confirmed_tags ?? []);
  const techTags = new Set(person.tech_literacy ?? []);
  const riskFlags = new Set(person.risk_flags ?? []);
  const sev = tool.hazards.severity;
  const fails = [];

  // G0 clinical review
  if (opts.requireClinicalReview && tool.safety_review?.status !== 'clinician_reviewed') {
    fails.push(F('G0_REVIEW', 'REVIEW_REQUIRED', 'hard', 'Catalogue entry has not been clinician-reviewed'));
  }

  // G1 risk screening must be complete before anything with a contraindication list or real hazard
  const needsScreen = (tool.contraindicated_if_any?.length ?? 0) > 0 || sev === 'moderate' || sev === 'high';
  if (needsScreen && !person.risk_screening_complete) {
    fails.push(F('G1_SCREENING', 'SCREENING_INCOMPLETE', 'unconfirmed', 'Risk-flag screening not completed'));
  }

  // G2 contraindications
  for (const flag of tool.contraindicated_if_any ?? []) {
    if (riskFlags.has(flag)) fails.push(F('G2_CONTRAINDICATION', 'CONTRAINDICATED', 'hard', `Contraindicated by risk flag: ${flag}`, { target: flag }));
  }

  // G3 capacity demands (physical / sensory / cognitive / communication)
  for (const [dim, raw] of Object.entries(tool.demands ?? {})) {
    const d = normalizeDemand(raw);
    const cap = caps[dim];
    if (cap === null || cap === undefined) {
      fails.push(F('G3_CAPACITY', 'CAPACITY_UNKNOWN', 'unconfirmed', `${dim} not assessed`, { target: dim }));
      continue;
    }
    const need = Math.min(4, d.min + (d.critical ? opts.safetyMargin[sev] ?? 0 : 0));
    if (cap < need) {
      fails.push(F('G3_CAPACITY', 'CAPACITY_BELOW_DEMAND', 'hard', `${dim} ${cap} < required ${need}${need > d.min ? ` (min ${d.min} + safety margin)` : ''}`, { target: dim }));
    }
  }

  // G4 graded supervision: below the level, a person must be present during use
  let supervisedUse = false;
  for (const s of tool.supervised_if_below ?? []) {
    const cap = caps[s.dimension];
    if (cap === null || cap === undefined) {
      fails.push(F('G4_SUPERVISION', 'CAPACITY_UNKNOWN', 'unconfirmed', `${s.dimension} not assessed (needed to decide supervision)`, { target: s.dimension }));
    } else if (cap < s.level) {
      supervisedUse = true;
      if (!envTags.has('caregiver_present_during_use')) {
        fails.push(F('G4_SUPERVISION', 'SUPERVISION_UNAVAILABLE', 'hard', `${s.dimension} ${cap} < ${s.level}: someone must be present during use`, { target: 'caregiver_present_during_use' }));
      }
    }
  }

  // G5 environmental gating: requirements must be EXPLICITLY confirmed; hazards must be absent
  for (const tag of tool.environment?.requires_all ?? []) {
    if (!envTags.has(tag)) fails.push(F('G5_ENVIRONMENT', 'ENV_REQUIREMENT_UNCONFIRMED', 'unconfirmed', `Environment does not confirm: ${tag}`, { target: tag }));
  }
  for (const tag of tool.environment?.forbids_any ?? []) {
    if (envTags.has(tag)) fails.push(F('G5_ENVIRONMENT', 'ENV_FORBIDDEN_PRESENT', 'hard', `Environment has blocking condition: ${tag}`, { target: tag }));
  }

  // G6 setup support + tech literacy. Setup may be done by a helper; daily use may not.
  const helper = envTags.has('helper_available_for_setup');
  if (tool.setup_requires_helper && !helper) {
    fails.push(F('G6_TECH', 'SETUP_HELPER_UNAVAILABLE', 'unconfirmed', 'Needs installation/setup by another person', { target: 'helper_available_for_setup' }));
  }
  for (const tag of tool.tech?.setup ?? []) {
    if (!techTags.has(tag) && !helper) fails.push(F('G6_TECH', 'TECH_UNCONFIRMED', 'unconfirmed', `Setup needs "${tag}" or a setup helper`, { target: tag }));
  }
  for (const tag of tool.tech?.daily_use ?? []) {
    if (!techTags.has(tag)) fails.push(F('G6_TECH', 'TECH_UNCONFIRMED', 'unconfirmed', `Daily use needs "${tag}"`, { target: tag }));
  }

  // G7 budget (preference, not safety)
  if (opts.enforceBudget && person.budget_band !== undefined && tool.cost_band > person.budget_band) {
    fails.push(F('G7_BUDGET', 'BUDGET_EXCEEDED', 'preference', `Cost band ${tool.cost_band} > budget band ${person.budget_band}`));
  }

  return { failures: fails, supervisedUse };
}

// ---------------------------------------------------------------- ranking (survivors only)

const EVIDENCE = { unassessed: 0.2, manufacturer_claim_only: 0.3, expert_consensus: 0.6, clinical_guideline: 0.85, controlled_study: 1.0 };
const HAZARD = { none: 1, low: 0.9, moderate: 0.7, high: 0.5 };
const WEIGHTS = Object.freeze({ headroom: 0.25, coverage: 0.25, simplicity: 0.20, hazard: 0.15, evidence: 0.10, cost: 0.05 });

function headroom(tool, caps) {
  const ds = Object.entries(tool.demands ?? {});
  if (!ds.length) return 1;
  const parts = ds.map(([dim, raw]) => {
    const { min } = normalizeDemand(raw);
    return min >= 4 ? 1 : Math.max(0, Math.min(1, (caps[dim] - min) / (4 - min)));
  });
  return parts.reduce((a, b) => a + b, 0) / parts.length;
}

function simplicity(tool, caps) {
  // Least-complex-solution-first (standard OT practice): less complex, less setup, lighter learning.
  const cx = 1 - tool.complexity / 3;
  const nl = caps.new_learning;
  // Unknown learning capacity only affects ranking (safety is decided by gates), so be conservative.
  const learnFit = tool.learning_burden === 0 ? 1 : nl == null ? 0.4 : Math.max(0, Math.min(1, (nl - tool.learning_burden + 2) / 3));
  return 0.5 * cx + 0.5 * learnFit;
}

function scoreTool(tool, profile, goals) {
  const caps = profile.person.capacities ?? {};
  const covered = goals.length ? tool.addresses.filter((a) => goals.includes(a)).length / goals.length : 1;
  const parts = {
    headroom: headroom(tool, caps),
    coverage: covered,
    simplicity: simplicity(tool, caps),
    hazard: HAZARD[tool.hazards.severity],
    evidence: EVIDENCE[tool.evidence] ?? 0.2,
    cost: 1 - tool.cost_band / 3,
  };
  const w = { ...WEIGHTS };
  if (profile.person.preferences?.prefer_low_tech) { w.simplicity += 0.10; w.headroom -= 0.10; }
  const score = Object.entries(w).reduce((s, [k, wt]) => s + wt * parts[k], 0);
  return { score: Math.round(score * 1000) / 1000, breakdown: parts };
}

// ---------------------------------------------------------------- main

function recommend({ profile, tools, taxonomy, options = {} }) {
  const opts = { ...DEFAULTS, ...options, safetyMargin: { ...DEFAULTS.safetyMargin, ...(options.safetyMargin ?? {}) } };
  validateCatalog(tools, taxonomy);
  validateProfile(profile, taxonomy);

  const goals = profile.occupation.goals ?? [];
  const query = profile.occupation.query ?? {};
  const relevant = tools.filter((t) => !goals.length || t.addresses.some((a) => goals.includes(a)));

  const eligible = [], excluded = [];
  for (const tool of relevant) {
    const { failures, supervisedUse } = evaluateGates(tool, profile, opts);
    if (failures.length === 0) eligible.push({ tool, supervisedUse });
    else excluded.push({ tool_id: tool.id, name: tool.name, failures, could_unlock: failures.every((f) => f.kind === 'unconfirmed') });
  }

  // Query (category / chips / search) runs strictly AFTER gating: it can only narrow (I1).
  const text = (query.text ?? '').trim().toLowerCase();
  const inCategoryText = eligible.filter(({ tool }) => {
    if (query.category && tool.category !== query.category) return false;
    if (text) {
      const hay = [tool.name, tool.summary, ...tool.tags, ...tool.addresses.map((a) => taxonomy.tasks[a].label)].join(' ').toLowerCase();
      if (!hay.includes(text)) return false;
    }
    return true;
  });
  const chipsWanted = query.chips ?? [];
  const shown = inCategoryText.filter(({ tool }) => chipsWanted.every((c) => tool.tags.includes(c)));

  const rank = (list) => list
    .map(({ tool, supervisedUse }) => {
      const s = scoreTool(tool, profile, goals);
      return {
        tool_id: tool.id, name: tool.name, kind: tool.kind, category: tool.category,
        addresses: tool.addresses.filter((a) => !goals.length || goals.includes(a)),
        score: s.score, breakdown: s.breakdown, summary: tool.summary,
        cautions: [
          ...(tool.hazards.notes ? [tool.hazards.notes] : []),
          ...(supervisedUse ? ['Use only with another person present.'] : []),
          ...(tool.setup_requires_helper ? ['Needs installation/setup by another person.'] : []),
        ],
        hazard_severity: tool.hazards.severity,
        review_status: tool.safety_review?.status ?? 'draft',
      };
    })
    .sort((a, b) => b.score - a.score || a.tool_id.localeCompare(b.tool_id));

  const recommendations = rank(shown);

  // Browse view (the category-card / chip / search UX). Built ONLY from survivors, so no card or chip
  // can lead to a disqualified tool; empty categories are omitted rather than shown "for browsing".
  const rankedCatText = rank(inCategoryText);
  const byCat = new Map();
  for (const r of rank(eligible.filter((e) => !query.category || e.tool.category === query.category))) {
    if (!byCat.has(r.category)) byCat.set(r.category, []);
    byCat.get(r.category).push(r.tool_id);
  }
  const chipCounts = {};
  for (const r of rankedCatText) for (const c of tools.find((t) => t.id === r.tool_id).tags) chipCounts[c] = (chipCounts[c] ?? 0) + 1;
  const browse = {
    featured: recommendations.slice(0, opts.featuredN).map((r) => r.tool_id),
    categories: taxonomy.categories
      .filter((c) => byCat.has(c.id))
      .sort((a, b) => a.sort - b.sort)
      .map((c) => ({ id: c.id, label: c.label, color: c.color, count: byCat.get(c.id).length, tool_ids: byCat.get(c.id) })),
    chips: Object.entries(chipCounts).map(([id, count]) => ({ id, label: taxonomy.chips[id], count })).sort((a, b) => b.count - a.count || a.id.localeCompare(b.id)),
  };

  return {
    recommendations,
    excluded,
    assessment_gaps: assessmentGaps(excluded),
    browse,
    meta: {
      engine_version: ENGINE_VERSION, taxonomy_version: taxonomy.version,
      options: opts, goals, evaluated: relevant.length, eligible: eligible.length, excluded: excluded.length,
      notice: 'Decision support only. Not a substitute for assessment by a qualified occupational therapist.',
    },
  };
}

// Which unanswered questions would unlock the most tools? Only counts tools with NO hard failure,
// so we never ask a question whose answer cannot change the outcome.
function assessmentGaps(excluded) {
  const gaps = new Map();
  for (const e of excluded) {
    for (const f of e.failures) {
      if (f.kind !== 'unconfirmed') continue;
      const key = `${f.code}:${f.target ?? ''}`;
      const g = gaps.get(key) ?? { code: f.code, target: f.target ?? null, blocks: 0, could_unlock: 0 };
      g.blocks += 1;
      if (e.could_unlock) g.could_unlock += 1;
      gaps.set(key, g);
    }
  }
  return [...gaps.values()].sort((a, b) => b.could_unlock - a.could_unlock || b.blocks - a.blocks || (a.code + a.target).localeCompare(b.code + b.target));
}

      row('Risk screening', `${p.person.risk_flags.length} flag${p.person.risk_flags.length === 1 ? '' : 's'} · screening ${p.person.risk_screening_complete ? 'done' : 'not done'}`, 'p_risk'),
      row('Tech and budget', `${p.person.tech_literacy.length} skills · ${T.budget_bands[p.person.budget_band ?? 3]}`, 'p_tech'),
      row('My home', `${p.environment.confirmed_tags.length} facts confirmed`, 'p_env')));
    v.append(el('div', { class: 'rows' }, row('Settings', S.review ? 'Production mode' : 'Demo mode', 'p_settings')));
  },

  p_goals(v) {
    const g = S.profile.occupation.goals;
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Pick what you want to do. With none picked, every safe tool is shown.' }));
    for (const c of T.categories) {
      const tasks = Object.entries(T.tasks).filter(([, t]) => t.category === c.id);
      v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: c.label }), el('div', { class: 'pills' }, ...tasks.map(([id, t]) => togglePill(t.label, g.includes(id), '', (on) => setIn(g, id, on))))));
    }
  },
  p_caps(v) {
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'What you can do reliably and safely on a bad day. "?" means not assessed, and counts against a tool.' }));
    v.append(el('div', { class: 'row2' }, ...['0 Unable', '1 Severe', '2 Moderate', '3 Mild', '4 Typical'].map((s) => el('span', { class: 'tag', text: s }))));
    const groups = {}; for (const [d, m] of Object.entries(T.dimensions)) (groups[m.group] ??= []).push([d, m.label]);
    for (const [grp, dims] of Object.entries(groups)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: grp }), ...dims.map(([d, label]) => capRow(d, label))));
  },
  p_risk(v) {
    const p = S.profile.person;
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Flags block tools that could hurt. Screening must be marked complete before any tool with a hazard is eligible.' }));
    v.append(el('div', { class: 'pills' }, ...Object.entries(T.risk_flags).map(([f, label]) => togglePill(label, p.risk_flags.includes(f), 'risk', (on) => setIn(p.risk_flags, f, on)))));
    v.append(switchRow('Risk screening completed', 'Confirm only after every flag has been asked about.', p.risk_screening_complete, (on) => { p.risk_screening_complete = on; }));
  },
  p_tech(v) {
    const p = S.profile.person;
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Skills I have' }), el('div', { class: 'pills' }, ...Object.entries(T.tech_tags).map(([t, label]) => togglePill(label, p.tech_literacy.includes(t), '', (on) => setIn(p.tech_literacy, t, on))))));
    const sel = el('select', { class: 'sel', 'aria-label': 'Budget', onchange: (e) => { p.budget_band = Number(e.target.value); refreshChrome(); } });
    for (const [k, l] of Object.entries(T.budget_bands)) sel.append(el('option', { value: k, text: l })); sel.value = String(p.budget_band ?? 3);
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Budget per tool' }), sel));
    v.append(switchRow('Prefer low-tech options', 'Ranks simple tools higher. Never affects safety.', !!p.preferences?.prefer_low_tech, (on) => { p.preferences = { ...(p.preferences ?? {}), prefer_low_tech: on }; }));
  },
  p_env(v) {
    const tags = S.profile.environment.confirmed_tags, blockers = new Set(TOOLS.flatMap((t) => t.environment.forbids_any));
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Only switch on what is true. Anything left off is treated as not supported. Red tags block some tools.' }));
    const domains = {}; for (const [t, m] of Object.entries(T.environment_tags)) (domains[m.domain] ??= []).push([t, m.label]);
    for (const [dom, list] of Object.entries(domains)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: dom }), el('div', { class: 'pills' }, ...list.map(([t, label]) => togglePill(label, tags.includes(t), 'env' + (blockers.has(t) ? ' forb' : ''), (on) => setIn(tags, t, on))))));
  },
  p_settings(v) {
    v.append(switchRow('Production mode', 'Only clinician-reviewed entries may be recommended. All 18 seed entries are drafts, so the app shows nothing.', S.review, (on) => { S.review = on; }));
    v.append(el('div', { class: 'box' }, el('h3', { text: 'About' }), el('div', { class: 'muted', text: 'Matches people to assistive tools and everyday workarounds using the Person-Environment-Occupation model. It supports compensation and adaptation, not rehabilitation. Thresholds here are engineering placeholders. Decision support only.' })));
    v.append(el('button', { class: 'btn ghost', text: 'Reset this example', onclick: () => { loadProfile(S.key); S.stack = [{ page: 'profile' }]; render(); } }));
  },
};

// ---------- controls
function refreshChrome() { const base = S.stack[0].page; const n = badgeCount(); const b = document.querySelector('.tab .badge'); const t = [...document.querySelectorAll('.tab')][2]; if (t) { b?.remove(); if (n) t.append(el('span', { class: 'badge', text: String(n) })); } }
function setIn(arr, v, on) { const i = arr.indexOf(v); if (on && i < 0) arr.push(v); if (!on && i >= 0) arr.splice(i, 1); refreshChrome(); }
function togglePill(label, on, cls, set) {
  const b = el('button', { class: 'pill ' + cls, 'aria-pressed': String(on), text: label });
  b.addEventListener('click', () => { const next = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(next)); set(next); });
  return b;
}
function switchRow(title, sub, on, set) {
  const t = el('button', { class: 'toggle', role: 'switch', 'aria-pressed': String(!!on), 'aria-label': title });
  t.addEventListener('click', () => { const next = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', String(next)); set(next); refreshChrome(); });
  return el('div', { class: 'switchrow' }, el('div', {}, el('b', { text: title }), el('div', { class: 'muted', style: 'font-size:13px', text: sub })), t);
}
function capRow(dim, label) {
  const caps = S.profile.person.capacities, seg = el('div', { class: 'seg', role: 'group', 'aria-label': label });
  const sync = () => [...seg.children].forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '' ? null : Number(b.dataset.v)) === (caps[dim] ?? null))));
  for (const v of [null, 0, 1, 2, 3, 4]) { const b = el('button', { class: v === null ? 'na' : '', 'data-v': v === null ? '' : String(v), text: v === null ? '?' : String(v), onclick: () => { caps[dim] = v; sync(); refreshChrome(); } }); seg.append(b); }
  sync();
  return el('div', { class: 'cap' }, el('span', { text: label }), seg);
}
function gapRow(g) {
  const T2 = { SCREENING_INCOMPLETE: 'Finish the risk screening', CAPACITY_UNKNOWN: `Assess: ${T.dimensions[g.target]?.label}`, ENV_REQUIREMENT_UNCONFIRMED: `Is this true at home? ${T.environment_tags[g.target]?.label}`, SETUP_HELPER_UNAVAILABLE: 'Can someone set tools up for you?', TECH_UNCONFIRMED: `Can you do this? ${T.tech_tags[g.target]}` };
  const apply = { SCREENING_INCOMPLETE: () => { S.profile.person.risk_screening_complete = true; }, ENV_REQUIREMENT_UNCONFIRMED: () => S.profile.environment.confirmed_tags.push(g.target), SETUP_HELPER_UNAVAILABLE: () => S.profile.environment.confirmed_tags.push('helper_available_for_setup'), TECH_UNCONFIRMED: () => S.profile.person.tech_literacy.push(g.target) }[g.code];
  return el('div', { class: 'ask' }, el('div', {}, el('b', { text: T2[g.code] ?? g.code }), el('span', { text: `unlocks ${g.could_unlock} tool${g.could_unlock === 1 ? '' : 's'}` })),
    apply ? el('button', { class: 'btn', text: 'Yes', onclick: () => { apply(); render(); } }) : el('button', { class: 'btn ghost', text: 'Assess', onclick: () => go('p_caps') }));
}
function loadProfile(k) {
  S.key = k; S.cat = null; S.chips = []; S.text = ''; S.task = null;
  S.profile = k === '__blank'
    ? { person: { label: 'Blank profile', capacities: {}, risk_flags: [], risk_screening_complete: false, tech_literacy: [], budget_band: 3 }, environment: { confirmed_tags: [] }, occupation: { goals: ['cut_food', 'take_medications', 'remember_appointments'] } }
    : clone(PROFILES[k]);
  render();
}
loadProfile(S.key);
</script>
