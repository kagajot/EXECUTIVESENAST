<title>PEO Assistive Matcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-sized app (bottom tabs, pushed pages) centred on white. On a real phone it fills the screen. */
:root{
  --bg:#FFFFFF; --surface:#F5F6FA; --ink:#1B2235; --muted:#626B85; --line:#E9EBF2; --accent:#C2570F; --accent-ink:#FFFFFF; --accent-soft:#FDEBDD;
  --ok:#1E8E5A; --ok-bg:#DDF3E8; --warn:#9A6200; --warn-bg:#FCEBC7; --bad:#B3261E; --bad-bg:#FBDCD9; --shadow:0 18px 50px rgba(27,34,53,.10);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.12} h2{font-size:19px} h3{font-size:16px}
.mono{font-family:var(--f-mono);font-size:11px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

.stage{height:100%;display:grid;place-items:center;padding:20px}
.app{position:relative;width:100%;max-width:410px;height:min(100%,860px);background:var(--bg);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:520px){.stage{padding:0;display:block}.app{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}}

.bar[hidden]{display:none}
.bar{display:flex;align-items:center;gap:8px;padding:14px 12px 6px;flex:none}
.bar h2{flex:1;text-align:center;font-size:16px;padding-right:40px}
.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px;min-height:0;scrollbar-width:thin}
.bar:not([hidden])+main{padding-top:10px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted)}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;color:var(--muted);font-size:11px;cursor:pointer;position:relative;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg)}
.search svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;outline:0}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* category cards: as in the reference screenshot, label left, character right */
.cards{display:flex;flex-direction:column;gap:12px}
.card{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:92px;padding:0 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;font:inherit;width:100%}
.card b{position:relative;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.15;max-width:62%} .card span{position:relative;font-size:13px;opacity:.85;max-width:62%}
.card .ill{position:absolute;right:8px;bottom:-8px;width:104px;height:104px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.card,.fcard,.vcard,.chk{transition:transform .12s}.card:active,.fcard:active,.vcard:active,.chk:active{transform:scale(.985)}.page{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}}
/* bubbles */
.bubbles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.bubbles::-webkit-scrollbar{display:none}
.bubble{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 24px;cursor:pointer;font-size:15px;color:var(--ink)}
.bubble[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* sections */
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead h2{font-size:20px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fcard{position:relative;flex:none;width:214px;height:150px;border:0;border-radius:20px;overflow:hidden;text-align:left;padding:16px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.fcard b{position:relative;font-family:var(--f-display);font-size:18px;line-height:1.15;max-width:80%}.fcard span{position:relative;font-size:13px;opacity:.85}
.fcard .ill{position:absolute;right:-6px;bottom:-12px;width:118px;height:118px;pointer-events:none}
.vcard{flex:none;width:236px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.vthumb{position:relative;height:126px;border-radius:20px;overflow:hidden;display:grid;place-items:center}
.vthumb .ill{position:absolute;right:-6px;bottom:-14px;width:92px;height:92px;opacity:.9}
.play{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 14px rgba(20,26,43,.18)}
.play::after{content:"";margin-left:3px;border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
.vcard b{font-size:14px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vrow{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border-radius:18px;padding:12px}
.vrow .vthumb{flex:none;width:96px;height:72px;border-radius:14px}.vrow .vthumb .play{width:34px;height:34px}.vrow .vthumb .play::after{border-left-width:10px;border-top-width:6px;border-bottom-width:6px}
.vrow .txt{min-width:0;display:flex;flex-direction:column;gap:4px}.vrow b{font-size:15px;line-height:1.3}
.ext{font-size:12px;color:var(--muted)}
.chk{position:relative;flex:none;width:214px;min-height:112px;border:0;border-radius:20px;overflow:hidden;text-align:left;padding:16px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.chk b{position:relative;font-family:var(--f-display);font-size:17px;line-height:1.15;max-width:75%}.chk span{position:relative;font-size:13px;opacity:.9}
.chk .ill{position:absolute;right:-8px;bottom:-14px;width:96px;height:96px;pointer-events:none}
.chk.full{width:100%;min-height:104px}
.mini{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.45);overflow:hidden;max-width:60%;margin-top:2px}.mini i{display:block;height:100%;background:currentColor;border-radius:9px}
.catbig{position:relative;overflow:hidden;border-radius:24px;min-height:150px;padding:22px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.catbig h1{position:relative;max-width:60%;font-size:26px}.catbig span{position:relative;font-size:14px;opacity:.85;max-width:62%}
.catbig .ill{position:absolute;right:6px;bottom:-10px;width:150px;height:150px;pointer-events:none}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.seg2 button{border:0;background:none;border-radius:999px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(20,26,43,.14)}
.stack{display:flex;flex-direction:column;gap:18px}
.hscroll{scroll-padding-inline:20px}
.card{height:92px;min-height:0}
.tile{width:60px;height:60px}.tile::before,.tile::after{display:none}.tile .ill{position:absolute;right:-6px;bottom:-8px;width:58px;height:58px}
.tag.hard,.tag.unconfirmed,.tag.preference{font-family:var(--f-body);font-weight:700;font-size:12px}
.preview{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:0;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.preview::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.vlabel{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.9);color:var(--ink);border-radius:8px;padding:3px 8px}
.pt i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vrow .vthumb .ill{display:none}
.tabs{grid-template-columns:repeat(5,1fr)!important}
.tab[aria-current=page]{color:var(--accent)!important}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:16px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px;cursor:pointer;border:0;text-align:left;width:100%}
.notice.safe{background:var(--ok-bg);color:var(--ok)}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;border:0;background:var(--surface);border-radius:18px;padding:12px;text-align:left;cursor:pointer;width:100%}
.tile{position:relative;flex:none;width:54px;height:54px;border-radius:16px;overflow:hidden}
.tile::before{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.35);right:-8px;top:-8px}
.tile::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);left:10px;bottom:9px}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.item .txt b{font-family:var(--f-display);font-size:16px}
.item .txt span{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:2px 8px;background:var(--surface);color:var(--muted);font-weight:500}
.item .tag{background:var(--bg)}
.tag.sev-high{background:var(--bad-bg);color:var(--bad)} .tag.sev-moderate{background:var(--warn-bg);color:var(--warn)} .tag.best{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.hard{background:var(--bad-bg);color:var(--bad);font-family:var(--f-mono)} .tag.unconfirmed{background:var(--warn-bg);color:var(--warn);font-family:var(--f-mono)} .tag.preference{font-family:var(--f-mono)}
.row2{display:flex;flex-wrap:wrap;gap:6px}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::before{width:150px;height:150px;right:-30px;top:-40px} .hero::after{width:70px;height:70px;right:90px;top:70px;background:rgba(255,255,255,.2)}
.hero *{position:relative} .hero h1{font-size:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.check.warn i{background:var(--warn-bg);color:var(--warn)}
.meter{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.meter .bar2{height:6px;border-radius:9px;background:var(--surface);overflow:hidden}.meter .bar2 i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter .mono{text-align:right}
.box{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}

.empty{background:var(--surface);border-radius:18px;padding:18px;color:var(--muted);text-align:center}
.reason{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.blocked{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.blocked .reason{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:baseline}
.ask{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px 14px}
.ask b{display:block;font-weight:700}.ask span{font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;flex:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.rowlink:first-child{border-top:0}
.rowlink small{color:var(--muted);display:block}
.rowlink svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
select.sel{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:0;border-radius:14px;padding:13px 14px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.risk[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pill.env[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.env.forb[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cap{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(27,34,53,.15)}
.seg button.na[aria-pressed=true]{color:var(--warn)}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px}
.toggle{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed=true]{background:var(--accent)} .toggle[aria-pressed=true]::after{transform:translateX(20px)}
.tabs[hidden]{display:none}
.ob-head{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:6px;border-radius:9px;background:var(--surface);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.foot{position:sticky;bottom:-24px;margin:auto -20px -24px;padding:14px 20px 22px;background:linear-gradient(rgba(255,255,255,0),#fff 28%);display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn.wide{width:100%;padding:15px 20px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.big-h{font-size:30px}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt i{flex:none;width:32px;height:32px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700}
.legend{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.savebtn{align-self:flex-start}
textarea.sum{width:100%;min-height:340px;font:12px/1.5 var(--f-mono);color:var(--ink);background:var(--surface);border:0;border-radius:16px;padding:14px;resize:vertical}
.reason{flex-direction:column!important;align-items:flex-start;gap:4px}
.reason .tag,.blocked .tag.hard,.blocked .tag.unconfirmed,.bcard .tag{font-family:var(--f-body)}
.tag.hard,.tag.unconfirmed,.tag.preference{font-family:var(--f-body);letter-spacing:.01em}
.chk .ill{right:-2px;bottom:-4px;width:84px;height:84px}
.chk{min-height:112px}
.page.home{gap:28px}
.h-home{font-size:27px;line-height:1.12}
.herocard{position:relative;overflow:hidden;border:0;border-radius:28px;min-height:236px;padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%;justify-content:flex-end}
.herocard>*{position:relative}
.herocard h2{font-size:26px;line-height:1.08;max-width:64%;font-weight:800}
.herocard p{font-size:14px;line-height:1.4;opacity:.85;max-width:60%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.herobtn{align-self:flex-start;background:#fff;color:var(--ink);font-weight:700;border-radius:999px;padding:10px 18px;font-size:14px;margin-top:6px;box-shadow:0 4px 14px rgba(20,26,43,.12)}
.herocard .ill{position:absolute;right:-8px;bottom:-16px;width:168px;height:168px;pointer-events:none}
.circs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:2px 20px 4px;scroll-padding-inline:20px}
.circs::-webkit-scrollbar{display:none}
.circ{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink);width:72px;padding:0}
.circ .dot{position:relative;width:72px;height:72px;border-radius:50%;overflow:hidden;display:block}
.circ .dot .ill{position:absolute;left:11px;top:13px;width:50px;height:50px}
@media (prefers-reduced-motion:no-preference){.herocard,.circ{transition:transform .12s}.herocard:active,.circ:active{transform:scale(.98)}}
#view>*{flex-shrink:0}
.herocard{min-height:250px}
.herocard h2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:24px}
.herocard p{flex:none;-webkit-line-clamp:2}
.chk.full b,.chk.full span{max-width:66%}
.herocard h2{font-size:22px;max-width:68%}
.extico{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center}
.vrow .vthumb .extico{width:18px;height:18px;right:5px;top:5px}
/* background: one soft curve behind the top of each main page. Detail pages stay clean. */

        Tool: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
        Guide: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.4 1.4L7 5M3.5 12l1.4 1.4L7 11M3.5 18l1.4 1.4L7 17"/>',
        Article: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 8h3"/>',
        Video: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z"/>',
        'Check-in': '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/>',
      };
      const mcard = ({ type, color, character, title, meta, onclick, href, play }) => {
        const top = el('div', { class: 'mtop', style: `background:${color};color:${onColor(color)}` }, el('span', { class: 'tbadge', html: `<svg viewBox="0 0 24 24">${TYPE_ICON[type]}</svg>${type}${href ? ' ↗' : ''}` }), play ? el('span', { class: 'play', 'aria-hidden': 'true' }) : ill(character));
        const body = el('div', { class: 'mbody' }, el('b', { text: title }), el('span', { text: meta }));
        return href ? el('a', { class: 'mcard', href, target: '_blank', rel: 'noopener noreferrer', 'aria-label': title + ' (opens YouTube)' }, top, body) : el('button', { class: 'mcard', onclick }, top, body);
      };
      const row = (title, more, cards) => el('div', { class: 'sec' }, el('div', { class: 'sechead' }, el('h2', { text: title }), more ? el('button', { class: 'link', text: 'See all', onclick: more }) : null), el('div', { class: 'hscroll' }, ...cards));
      const toLearn = (t) => () => { S.learnTab = t; tab('learn'); };

      if (recs.length) box.append(row('Top picks for you', () => go('category', '__best'), recs.slice(0, 8).map((r) => mcard({ type: 'Tool', color: CAT[r.category].color, character: r.category, title: r.name, meta: CAT[r.category].label, onclick: () => go('tool', r.tool_id) }))));
      else box.append(el('div', { class: 'sec' }, el('h2', { text: 'Top picks for you' }), el('div', { class: 'empty', style: 'text-align:left' }, S.review ? 'Nothing can be shown until the catalogue is clinician-reviewed.' : 'Nothing has passed the safety checks yet. Your picks will appear here.', el('br'), el('button', { class: 'link', text: 'Start a check-in', onclick: toLearn('checkins') }))));
      const openChecks = CHECKINS.filter((c) => { const inf = checkinInfo(c, all); return inf.done < inf.total; });
      if (openChecks.length) box.append(row('Continue your check-ins', toLearn('checkins'), openChecks.map((c) => mcard({ type: 'Check-in', color: c.color, character: c.ill, title: c.title, meta: checkinInfo(c, all).label, onclick: () => go('checkin', c.id) }))));
      const rel = (g) => (g.tool && ids.has(g.tool) ? 0 : 1);
      box.append(row('Step by step', toLearn('guides'), GUIDES.filter((x) => guideState(x) !== 'blocked').sort((a, b) => rel(a) - rel(b)).map((g) => mcard({ type: 'Guide', color: guideMeta(g).color, character: guideMeta(g).ill, title: g.title, meta: `${g.steps.length} steps · ${g.minutes} min`, onclick: () => go('guide', g.id) }))));
      const vids = VIDEOS.filter((x) => videoState(x, ids) !== 'blocked');
      if (vids.length) box.append(row('Watch and learn', toLearn('videos'), vids.map((x) => mcard({ type: 'Video', color: CAT[x.category].color, title: x.title, meta: x.label, href: x.url, play: true }))));
      box.append(row('Read', toLearn('articles'), ARTICLES.map((a) => mcard({ type: 'Article', color: a.color, character: a.ill, title: a.title, meta: `${a.topic} · ${a.minutes} min read`, onclick: () => go('article', a.id) }))));
    };
    v.append(searchBox(S.text, (t) => { S.text = t; draw(); }), box); draw();
  },

  categories(v) {
    const g = S.profile.occupation.goals, recs = run({}).recommendations, cards = el('div', { class: 'cards' });
    const sub = (n, inGoals) => (n ? `${n} safe option${n === 1 ? '' : 's'}` : inGoals ? 'Nothing safe yet' : 'Not in your goals');
    cards.append(catCard('Best matches', sub(recs.length, true), FEATURED_COLOR, 'featured', () => go('category', '__best')));
    for (const c of T.categories) {
      const n = recs.filter((r) => r.category === c.id).length, inGoals = !g.length || Object.entries(T.tasks).some(([id, t]) => t.category === c.id && g.includes(id));
      cards.append(catCard(c.label, sub(n, inGoals), c.color, c.id, () => go('category', c.id)));
    }
    v.append(el('h1', { text: 'Categories' }), cards);
  },

  category(v, id) {
    const best = id === '__best', meta = best ? { label: 'Best matches', color: FEATURED_COLOR, ill: 'featured' } : { label: CAT[id].label, color: CAT[id].color, ill: id };
    const all = run({}), recs = all.recommendations.filter((r) => best || r.category === id), ids = new Set(all.recommendations.map((r) => r.tool_id));
    const out = all.excluded.filter((e) => best || toolOf(e.tool_id).category === id);
    let task = null;
    v.append(el('div', { class: 'catbig', style: `background:${meta.color};color:${onColor(meta.color)}` }, el('h1', { text: meta.label }), el('span', { text: recs.length ? `${recs.length} safe option${recs.length === 1 ? '' : 's'}${out.length ? ` · ${out.length} kept out` : ''}` : out.length ? `${out.length} kept out for your safety` : 'No tools yet' }), ill(meta.ill)));
    const list = el('div', { class: 'sec' }), tasks = best ? [] : Object.entries(T.tasks).filter(([, t]) => t.category === id);
    const draw = () => {
      list.replaceChildren();
      const r = task ? recs.filter((x) => x.addresses.includes(task)) : recs;
      if (r.length) list.append(el('div', { class: 'list' }, ...r.map((x, i) => toolItem(x, i === 0 && !task))));
      else list.append(el('div', { class: 'empty', text: S.review ? 'Nothing can be shown while the catalogue has no clinician-reviewed entries.' : 'No tool here has passed every safety check for you yet.' }));
    };
    if (tasks.length) { const row = el('div', { class: 'bubbles' }, ...tasks.map(([tid, t]) => el('button', { class: 'bubble', 'aria-pressed': 'false', text: t.label, onclick: (e) => { task = task === tid ? null : tid; [...row.children].forEach((b) => b.setAttribute('aria-pressed', 'false')); if (task) e.currentTarget.setAttribute('aria-pressed', 'true'); draw(); } }))); v.append(row); }
    v.append(list); draw();
    if (out.length) v.append(el('p', { class: 'muted', style: 'font-size:13px', text: `${out.length} tool${out.length === 1 ? '' : 's'} in this category ${out.length === 1 ? 'does' : 'do'} not pass the safety checks for you yet.` }));
    const gd = GUIDES.filter((x) => (best || x.category === id) && guideState(x) !== 'blocked');
    if (gd.length) v.append(el('div', { class: 'sec' }, el('h2', { text: 'Step by step' }), el('div', { class: 'list' }, ...gd.map(guideRow))));
    const vids = VIDEOS.filter((x) => (best || x.category === id) && videoState(x, ids) !== 'blocked');
    if (vids.length) v.append(el('div', { class: 'sec' }, el('h2', { text: 'Watch and learn' }), ...vids.map((x) => videoNode(x, videoState(x, ids), true))));
  },

  learn(v) {
    const all = run({}), ids = new Set(all.recommendations.map((r) => r.tool_id));
    v.append(el('h1', { text: 'Learn' }));
    const body = el('div', { class: 'sec' }), seg = el('div', { class: 'seg2' });
    const draw = () => {
      [...seg.children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === S.learnTab)));
      body.replaceChildren();
      if (S.learnTab === 'videos') {
        const rank = { ok: 0, general: 1, blocked: 2 };
        body.append(...[...VIDEOS].sort((a, b) => rank[videoState(a, ids)] - rank[videoState(b, ids)]).map((x) => videoNode(x, videoState(x, ids), true)));
      } else if (S.learnTab === 'guides') {
        body.append(...[...GUIDES].sort((a, b) => guideRank[guideState(a)] - guideRank[guideState(b)]).map(guideRow));
      } else if (S.learnTab === 'articles') {
        body.append(el('div', { class: 'alist' }, ...ARTICLES.map(articleRow)));
      } else {
        body.append(...CHECKINS.map((c) => checkinCard(c, all, true)));
      }
    };
    for (const [t, l] of [['videos', 'Videos'], ['guides', 'Guides'], ['articles', 'Articles'], ['checkins', 'Check-ins']]) seg.append(el('button', { 'data-t': t, text: l, onclick: () => { S.learnTab = t; draw(); } }));
    v.append(seg, body); draw();
  },

  guide(v, id) {
    const g = GUIDES.find((x) => x.id === id), m = guideMeta(g), st = guideState(g);
    v.append(el('div', { class: 'catbig', style: `background:${m.color};color:${onColor(m.color)}` }, el('h1', { text: g.title }), el('span', { text: `${g.steps.length} steps · ${g.minutes} min read` }), ill(m.ill)));
    if (st === 'blocked') { v.append(el('div', { class: 'empty', text: 'This tool does not pass the safety checks for you yet. Ask your therapist about it.' })); return; }
    v.append(el('div', { class: 'steps' }, ...g.steps.map((x, i) => el('div', { class: 'step' }, el('span', { class: 'num', text: String(i + 1) }), el('div', {}, el('b', { text: x.t }), el('p', { text: x.d }))))));
    if (g.watch.length) v.append(el('div', { class: 'box warnbox' }, el('h3', { text: 'Watch out' }), ...g.watch.map((w) => el('div', { class: 'check warn' }, el('i', { text: '!' }), el('span', { text: w })))));
    if (g.tool) v.append(el('button', { class: 'btn', text: 'See the tool', onclick: () => go('tool', g.tool) }));
    if (g.action === 'summary') v.append(el('button', { class: 'btn', text: 'Open my summary', onclick: openSummary }));
  },

  article(v, id) {
    const a = ARTICLES.find((x) => x.id === id);
    v.append(el('div', { class: 'catbig', style: `background:${a.color};color:${onColor(a.color)}` }, el('h1', { text: a.title }), el('span', { text: `${a.topic} · ${a.minutes} min read` }), ill(a.ill)));
    v.append(el('div', { class: 'inshort' }, el('div', { class: 'label', text: 'In short' }), el('p', { text: a.summary })));
    for (const sec of a.sections) v.append(el('section', { class: 'art' }, el('h3', { text: sec.h }), ...(sec.p ?? []).map((t) => el('p', { text: t })), sec.list ? el('ul', {}, ...sec.list.map((t) => el('li', { text: t }))) : null));
    v.append(el('div', { class: 'box' }, el('h3', { text: 'Key points' }), ...a.points.map((t) => el('div', { class: 'check' }, el('i', { text: '✓' }), el('span', { text: t })))));
    if (a.cta) v.append(el('button', { class: 'btn', text: a.cta.text, onclick: ARTICLE_ACTS[a.cta.act] }));
  },

  checkin(v, id) {
    const c = CHECKINS.find((x) => x.id === id), all = run({}), info = checkinInfo(c, all);
    v.append(el('div', { class: 'catbig', style: `background:${c.color};color:${onColor(c.color)}` }, el('h1', { text: c.title }), el('span', { text: info.label }), ill(c.ill)));
    if (c.kind === 'risk') {
      const p = S.profile.person;
      v.append(el('div', { class: 'pills' }, ...Object.entries(T.risk_flags).map(([f, label]) => togglePill(label, p.risk_flags.includes(f), 'risk', (on) => setIn(p.risk_flags, f, on)))),
        switchRow('I have read the whole list', 'Confirm only after every flag has been asked about.', p.risk_screening_complete, (on) => { p.risk_screening_complete = on; }));
    } else if (c.kind === 'env') {
      const tags = S.profile.environment.confirmed_tags, blockers = new Set(TOOLS.flatMap((t) => t.environment.forbids_any));
      v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Only what is definitely true.' }));
      const domains = {}; for (const [t, m] of Object.entries(T.environment_tags)) (domains[m.domain] ??= []).push([t, m.label]);
      for (const [dom, list] of Object.entries(domains)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: dom }), el('div', { class: 'pills' }, ...list.map(([t, label]) => togglePill(label, tags.includes(t), 'env' + (blockers.has(t) ? ' forb' : ''), (on) => setIn(tags, t, on))))));
    } else {
      v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Think of a bad day.' }), LEGEND(), ...c.dims.map((d) => capRow(d, QUESTION[d])));
    }
    v.append(el('button', { class: 'btn', text: 'See what this opens up', onclick: () => tab('explore') }));
  },

  tool(v, id) {
    const t = toolOf(id), caps = S.profile.person.capacities, r = run({}).recommendations.find((x) => x.tool_id === id), color = CAT[t.category].color;
    v.append(el('div', { class: 'hero', style: `background:${color};color:${onColor(color)}` }, el('span', { class: 'label', style: 'color:inherit;opacity:.8', text: `${CAT[t.category].label} · ${t.kind === 'device' ? 'Device' : t.kind === 'digital' ? 'Digital' : 'Everyday workaround'}` }), el('h1', { text: t.name })));
    if (r) {
      const btn = el('button', { class: 'btn savebtn' + (S.saved.includes(id) ? ' ghost' : ''), text: S.saved.includes(id) ? 'Saved to my toolkit' : 'Save to my toolkit' });
      btn.addEventListener('click', () => { setIn(S.saved, id, !S.saved.includes(id)); btn.textContent = S.saved.includes(id) ? 'Saved to my toolkit' : 'Save to my toolkit'; btn.classList.toggle('ghost', S.saved.includes(id)); });
      v.append(btn);
    }
    v.append(el('p', { style: 'margin:0', text: t.summary }));
    v.append(el('div', { class: 'sec' }, el('h3', { text: 'Helps you' }), el('div', { class: 'row2' }, ...t.addresses.map((a) => el('span', { class: 'tag', text: T.tasks[a].label })))));
    const checks = [];
    for (const [dim, raw] of Object.entries(t.demands)) { const min = typeof raw === 'number' ? raw : raw.min; checks.push(`${T.dimensions[dim].label}: you are at ${caps[dim] ?? 'not assessed'}, this needs ${min}${typeof raw === 'object' && raw.critical && t.hazards.severity === 'high' ? ' plus a safety margin' : ''}`); }
    for (const tag of t.environment.requires_all) checks.push(`Home: ${T.environment_tags[tag].label}`);
    for (const tag of t.environment.forbids_any) checks.push(`Home has no: ${T.environment_tags[tag].label.toLowerCase()}`);
    for (const tag of [...t.tech.daily_use, ...t.tech.setup]) checks.push(`Tech: ${T.tech_tags[tag]}`);
    v.append(el('div', { class: 'box' }, el('h3', { text: 'Why it fits you' }), ...(checks.length ? checks : ['No ability, home or tech requirements.']).map((c) => el('div', { class: 'check' }, el('i', { text: '✓' }), el('span', { text: c })))));
    if (r && r.cautions.length) v.append(el('div', { class: 'box' }, el('h3', { text: 'Take care' }), ...r.cautions.map((c) => el('div', { class: 'check warn' }, el('i', { text: '!' }), el('span', { text: c })))));
    if (r) {
      const names = { headroom: 'Ability margin', coverage: 'Covers your goals', simplicity: 'Simplicity', hazard: 'Low hazard', evidence: 'Evidence', cost: 'Low cost' };
      v.append(el('div', { class: 'box' }, el('div', { class: 'linkrow' }, el('h3', { text: 'How it ranked' }), el('span', { class: 'mono', text: r.score.toFixed(2) })),
        ...Object.entries(r.breakdown).map(([k, val]) => el('div', { class: 'meter' }, el('span', { text: names[k] }), el('div', { class: 'bar2' }, el('i', { style: `width:${Math.round(val * 100)}%` })), el('span', { class: 'mono', text: val.toFixed(2) })))));
    } else v.append(el('div', { class: 'empty', text: 'This tool no longer passes the safety checks for your current answers.' }));
    v.append(el('div', { class: 'muted', style: 'font-size:12px', text: `Catalogue status: ${t.safety_review.status}. Decision support only; not a substitute for an occupational therapist.` }));
  },

  profile(v) {
    const p = S.profile, dims = Object.keys(T.dimensions), assessed = dims.filter((d) => p.person.capacities[d] != null).length;
    v.append(el('div', { class: 'head' }, el('h1', { text: 'Profile' })));
    const row = (title, sub, page) => el('button', { class: 'rowlink', onclick: () => go(page) }, el('span', {}, el('b', { text: title }), el('small', { text: sub })), el('span', { html: CHEV }));
    v.append(el('div', { class: 'rows' },
      row('What I want to do', `${p.occupation.goals.length} of ${Object.keys(T.tasks).length} selected`, 'p_goals'),
      row('Abilities', `${assessed} of ${dims.length} assessed`, 'p_caps'),
      row('Risk screening', `${p.person.risk_flags.length} flag${p.person.risk_flags.length === 1 ? '' : 's'} · screening ${p.person.risk_screening_complete ? 'done' : 'not done'}`, 'p_risk'),
      row('Tech and budget', `${p.person.tech_literacy.length} skills · ${T.budget_bands[p.person.budget_band ?? 3]}`, 'p_tech'),
      row('My home', `${p.environment.confirmed_tags.length} facts confirmed`, 'p_env')));
    v.append(el('div', { class: 'rows' }, row('Summary for my therapist', 'A copyable text of your answers and results', 'summary'), row('Settings', S.review ? 'Clinician review required' : 'Preview catalogue', 'p_settings')));
  },

  summary(v) {
    const text = summaryText(), ta = el('textarea', { class: 'sum', readonly: true, 'aria-label': 'Summary text' }); ta.value = text;
    const btn = el('button', { class: 'btn', text: 'Copy summary' });
    btn.addEventListener('click', async () => { try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; } catch { ta.focus(); ta.select(); btn.textContent = 'Now copy the selected text'; } });
    v.append(btn, ta);
  },

  p_goals(v) {
    const g = S.profile.occupation.goals;
    v.append();
    for (const c of T.categories) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: c.label }), el('div', { class: 'pills' }, ...Object.entries(T.tasks).filter(([, t]) => t.category === c.id).map(([id, t]) => togglePill(t.label, g.includes(id), '', (on) => setIn(g, id, on))))));
  },
  p_caps(v) {
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Think of a bad day.' }), LEGEND());
    const groups = {}; for (const [d, m] of Object.entries(T.dimensions)) (groups[m.group] ??= []).push(d);
    for (const [grp, dims] of Object.entries(groups)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: grp }), ...dims.map((d) => capRow(d, QUESTION[d]))));
  },
  p_risk(v) {
    const p = S.profile.person;
    v.append(el('div', { class: 'pills' }, ...Object.entries(T.risk_flags).map(([f, label]) => togglePill(label, p.risk_flags.includes(f), 'risk', (on) => setIn(p.risk_flags, f, on)))),
      switchRow('I have read the whole list', 'Confirm only after every flag has been asked about.', p.risk_screening_complete, (on) => { p.risk_screening_complete = on; }));
  },
  p_tech(v) {
    const p = S.profile.person;
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Skills I have' }), el('div', { class: 'pills' }, ...Object.entries(T.tech_tags).map(([t, label]) => togglePill(label, p.tech_literacy.includes(t), '', (on) => setIn(p.tech_literacy, t, on))))));
    const sel = el('select', { class: 'sel', 'aria-label': 'Budget', onchange: (e) => { p.budget_band = Number(e.target.value); refreshChrome(); } });
    for (const [k, l] of Object.entries(T.budget_bands)) sel.append(el('option', { value: k, text: l })); sel.value = String(p.budget_band ?? 3);
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Most I would spend on one tool' }), sel), switchRow('Prefer low-tech options', 'Ranks simple tools higher. Never affects safety.', !!p.preferences?.prefer_low_tech, (on) => { p.preferences = { ...(p.preferences ?? {}), prefer_low_tech: on }; }));
  },
  p_env(v) {
    const tags = S.profile.environment.confirmed_tags, blockers = new Set(TOOLS.flatMap((t) => t.environment.forbids_any));
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Only what is true.' }));
    const domains = {}; for (const [t, m] of Object.entries(T.environment_tags)) (domains[m.domain] ??= []).push([t, m.label]);
    for (const [dom, list] of Object.entries(domains)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: dom }), el('div', { class: 'pills' }, ...list.map(([t, label]) => togglePill(label, tags.includes(t), 'env' + (blockers.has(t) ? ' forb' : ''), (on) => setIn(tags, t, on))))));
  },
  p_settings(v) {
    v.append(switchRow('Require clinician review', 'Only clinician-reviewed entries may be shown. Every entry is currently an unreviewed draft, so turning this on shows nothing.', S.review, (on) => { S.review = on; }));
    v.append(el('div', { class: 'box' }, el('h3', { text: 'About' }), el('div', { class: 'muted', text: 'Matches people to assistive tools and everyday workarounds using the Person-Environment-Occupation model. It supports compensation and adaptation, not rehabilitation. Tool entries have not been reviewed by a clinician, and thresholds are engineering placeholders. Videos are third-party YouTube links we have not reviewed. Decision support only.' })));
    const ex = el('select', { class: 'sel', 'aria-label': 'Load an example', onchange: (e) => { if (!e.target.value) return; S.profile = clone(EXAMPLES[e.target.value]); S.onboarded = true; S.saved = []; tab('home'); } }, el('option', { value: '', text: 'Load an example profile (replaces your answers)' }), ...Object.entries(EXAMPLES).map(([k, p]) => el('option', { value: k, text: p.person.label })));
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Try an example' }), ex));
    const reset = el('button', { class: 'btn ghost', text: S.confirmReset ? 'Tap again to erase everything' : 'Erase my answers and start over' });
    reset.addEventListener('click', () => { if (!S.confirmReset) { S.confirmReset = true; reset.textContent = 'Tap again to erase everything'; return; } S.confirmReset = false; S.profile = blank(); S.saved = []; S.onboarded = false; S.step = 0; S.stack = [{ page: 'onboard' }]; render(); });
    v.append(reset);
  },
};
load(); render();
</script>
