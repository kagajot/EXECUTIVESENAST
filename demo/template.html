<title>PEO Assistive Matcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-sized app (bottom tabs, pushed pages) centred on white. On a real phone it fills the screen. */
:root{
  --bg:#FFFFFF; --surface:#F5F6FA; --ink:#1B2235; --muted:#626B85; --line:#E9EBF2; --accent:#E8742B; --accent-ink:#FFFFFF; --accent-soft:#FDEBDD;
  --ok:#1E8E5A; --ok-bg:#DDF3E8; --warn:#9A6200; --warn-bg:#FCEBC7; --bad:#B3261E; --bad-bg:#FBDCD9; --shadow:0 18px 50px rgba(27,34,53,.10);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.12} h2{font-size:19px} h3{font-size:16px}
.mono{font-family:var(--f-mono);font-size:11px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

.stage{height:100%;display:grid;place-items:center;padding:20px}
.app{position:relative;width:100%;max-width:410px;height:min(100%,860px);background:var(--bg);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:520px){.stage{padding:0;display:block}.app{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}}

.bar[hidden]{display:none}
.bar{display:flex;align-items:center;gap:8px;padding:14px 12px 6px;flex:none}
.bar h2{flex:1;text-align:center;font-size:16px;padding-right:40px}
.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px;min-height:0;scrollbar-width:thin}
.bar:not([hidden])+main{padding-top:10px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted)}

.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;color:var(--muted);font-size:11px;cursor:pointer;position:relative;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg)}
.search svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;outline:0}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* category cards: as in the reference screenshot, label left, character right */
.cards{display:flex;flex-direction:column;gap:12px}
.card{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:92px;padding:0 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;font:inherit;width:100%}
.card b{position:relative;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.15;max-width:62%} .card span{position:relative;font-size:13px;opacity:.85;max-width:62%}
.card .ill{position:absolute;right:8px;bottom:-8px;width:104px;height:104px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.card,.fcard,.vcard,.chk{transition:transform .12s}.card:active,.fcard:active,.vcard:active,.chk:active{transform:scale(.985)}.page{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}}
/* bubbles */
.bubbles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.bubbles::-webkit-scrollbar{display:none}
.bubble{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 24px;cursor:pointer;font-size:15px;color:var(--ink)}
.bubble[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* sections */
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead h2{font-size:20px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fcard{position:relative;flex:none;width:214px;height:150px;border:0;border-radius:20px;overflow:hidden;text-align:left;padding:16px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.fcard b{position:relative;font-family:var(--f-display);font-size:18px;line-height:1.15;max-width:80%}.fcard span{position:relative;font-size:13px;opacity:.85}
.fcard .ill{position:absolute;right:-6px;bottom:-12px;width:118px;height:118px;pointer-events:none}
.vcard{flex:none;width:236px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.vthumb{position:relative;height:126px;border-radius:20px;overflow:hidden;display:grid;place-items:center}
.vthumb .ill{position:absolute;right:-6px;bottom:-14px;width:92px;height:92px;opacity:.9}
.play{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 14px rgba(20,26,43,.18)}
.play::after{content:"";margin-left:3px;border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
.vcard b{font-size:14px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vrow{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border-radius:18px;padding:12px}
.vrow .vthumb{flex:none;width:96px;height:72px;border-radius:14px}.vrow .vthumb .play{width:34px;height:34px}.vrow .vthumb .play::after{border-left-width:10px;border-top-width:6px;border-bottom-width:6px}
.vrow .txt{min-width:0;display:flex;flex-direction:column;gap:4px}.vrow b{font-size:15px;line-height:1.3}
.ext{font-size:12px;color:var(--muted)}
.chk{position:relative;flex:none;width:214px;min-height:112px;border:0;border-radius:20px;overflow:hidden;text-align:left;padding:16px;scroll-snap-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.chk b{position:relative;font-family:var(--f-display);font-size:17px;line-height:1.15;max-width:75%}.chk span{position:relative;font-size:13px;opacity:.9}
.chk .ill{position:absolute;right:-8px;bottom:-14px;width:96px;height:96px;pointer-events:none}
.chk.full{width:100%;min-height:104px}
.mini{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.45);overflow:hidden;max-width:60%;margin-top:2px}.mini i{display:block;height:100%;background:currentColor;border-radius:9px}
.catbig{position:relative;overflow:hidden;border-radius:24px;min-height:150px;padding:22px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.catbig h1{position:relative;max-width:60%;font-size:26px}.catbig span{position:relative;font-size:14px;opacity:.85;max-width:62%}
.catbig .ill{position:absolute;right:6px;bottom:-10px;width:150px;height:150px;pointer-events:none}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.seg2 button{border:0;background:none;border-radius:999px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(20,26,43,.14)}
.stack{display:flex;flex-direction:column;gap:18px}
.vrow .vthumb .ill{display:none}
.tabs{grid-template-columns:repeat(5,1fr)!important}
.tab[aria-current=page]{color:var(--accent)!important}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:16px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px;cursor:pointer;border:0;text-align:left;width:100%}
.notice.safe{background:var(--ok-bg);color:var(--ok)}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;border:0;background:var(--surface);border-radius:18px;padding:12px;text-align:left;cursor:pointer;width:100%}
.tile{position:relative;flex:none;width:54px;height:54px;border-radius:16px;overflow:hidden}
.tile::before{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.35);right:-8px;top:-8px}
.tile::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);left:10px;bottom:9px}
.item .txt{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.item .txt b{font-family:var(--f-display);font-size:16px}
.item .txt span{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:2px 8px;background:var(--surface);color:var(--muted);font-weight:500}
.item .tag{background:var(--bg)}
.tag.sev-high{background:var(--bad-bg);color:var(--bad)} .tag.sev-moderate{background:var(--warn-bg);color:var(--warn)} .tag.best{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.hard{background:var(--bad-bg);color:var(--bad);font-family:var(--f-mono)} .tag.unconfirmed{background:var(--warn-bg);color:var(--warn);font-family:var(--f-mono)} .tag.preference{font-family:var(--f-mono)}
.row2{display:flex;flex-wrap:wrap;gap:6px}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::before{width:150px;height:150px;right:-30px;top:-40px} .hero::after{width:70px;height:70px;right:90px;top:70px;background:rgba(255,255,255,.2)}
.hero *{position:relative} .hero h1{font-size:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.check.warn i{background:var(--warn-bg);color:var(--warn)}
.meter{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.meter .bar2{height:6px;border-radius:9px;background:var(--surface);overflow:hidden}.meter .bar2 i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter .mono{text-align:right}
.box{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}

.empty{background:var(--surface);border-radius:18px;padding:18px;color:var(--muted);text-align:center}
.reason{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.blocked{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.blocked .reason{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:baseline}
.ask{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px 14px}
.ask b{display:block;font-weight:700}.ask span{font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;flex:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.rowlink:first-child{border-top:0}
.rowlink small{color:var(--muted);display:block}
.rowlink svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
select.sel{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:0;border-radius:14px;padding:13px 14px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.risk[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pill.env[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.env.forb[aria-pressed=true]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cap{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(27,34,53,.15)}
.seg button.na[aria-pressed=true]{color:var(--warn)}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px}
.toggle{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed=true]{background:var(--accent)} .toggle[aria-pressed=true]::after{transform:translateX(20px)}
.tabs[hidden]{display:none}
.ob-head{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:6px;border-radius:9px;background:var(--surface);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.foot{position:sticky;bottom:-24px;margin:auto -20px -24px;padding:14px 20px 22px;background:linear-gradient(rgba(255,255,255,0),#fff 28%);display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn.wide{width:100%;padding:15px 20px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.big-h{font-size:30px}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt i{flex:none;width:32px;height:32px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700}
.legend{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.savebtn{align-self:flex-start}
textarea.sum{width:100%;min-height:340px;font:12px/1.5 var(--f-mono);color:var(--ink);background:var(--surface);border:0;border-radius:16px;padding:14px;resize:vertical}
</style>

<script>
const T = DATA.taxonomy, TOOLS = DATA.tools, EXAMPLES = DATA.profiles;

const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) if (c != null) n.append(c); return n; };
const CAT = Object.fromEntries(T.categories.map((c) => [c.id, c]));

const dark = (hex) => { const n = parseInt(hex.slice(1), 16); return 0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255) < 140; };

// ---------- state + on-device storage (this browser only; nothing is sent anywhere)
const LS = 'peo.app.v1';
const blank = () => ({ person: { label: 'My profile', capacities: {}, risk_flags: [], risk_screening_complete: false, tech_literacy: [], budget_band: 3 }, environment: { confirmed_tags: [] }, occupation: { goals: [] } });
const S = { profile: blank(), saved: [], onboarded: false, review: false, step: 0, stack: [{ page: 'onboard' }], cat: null, chips: [], text: '', task: null, confirmReset: false, learnTab: 'videos' };
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || 'null');
    if (d && d.profile) { validateProfile(d.profile, T); S.profile = d.profile; S.saved = (d.saved || []).filter((id) => TOOLS.some((t) => t.id === id)); S.onboarded = !!d.onboarded; S.review = !!d.review; S.step = d.step || 0; }

// ---------- router

const TITLES = { p_goals: 'What I want to do', p_caps: 'Abilities', p_risk: 'Risk screening', p_tech: 'Tech and budget', p_env: 'My home', p_settings: 'Settings', summary: 'Summary for my therapist' };

      el('div', { class: 'pills' }, ...Object.entries(T.risk_flags).map(([f, label]) => togglePill(label, p.risk_flags.includes(f), 'risk', (on) => setIn(p.risk_flags, f, on)))),
      switchRow('I have read the whole list', 'Confirm only after every flag has been asked about.', p.risk_screening_complete, (on) => { p.risk_screening_complete = on; }));
  },
  p_tech(v) {
    const p = S.profile.person;
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Skills I have' }), el('div', { class: 'pills' }, ...Object.entries(T.tech_tags).map(([t, label]) => togglePill(label, p.tech_literacy.includes(t), '', (on) => setIn(p.tech_literacy, t, on))))));
    const sel = el('select', { class: 'sel', 'aria-label': 'Budget', onchange: (e) => { p.budget_band = Number(e.target.value); refreshChrome(); } });
    for (const [k, l] of Object.entries(T.budget_bands)) sel.append(el('option', { value: k, text: l })); sel.value = String(p.budget_band ?? 3);
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Most I would spend on one tool' }), sel), switchRow('Prefer low-tech options', 'Ranks simple tools higher. Never affects safety.', !!p.preferences?.prefer_low_tech, (on) => { p.preferences = { ...(p.preferences ?? {}), prefer_low_tech: on }; }));
  },
  p_env(v) {
    const tags = S.profile.environment.confirmed_tags, blockers = new Set(TOOLS.flatMap((t) => t.environment.forbids_any));
    v.append(el('p', { class: 'muted', style: 'margin:0', text: 'Only switch on what is true. Anything left off is treated as not supported. Red tags block some tools.' }));
    const domains = {}; for (const [t, m] of Object.entries(T.environment_tags)) (domains[m.domain] ??= []).push([t, m.label]);
    for (const [dom, list] of Object.entries(domains)) v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: dom }), el('div', { class: 'pills' }, ...list.map(([t, label]) => togglePill(label, tags.includes(t), 'env' + (blockers.has(t) ? ' forb' : ''), (on) => setIn(tags, t, on))))));
  },
  p_settings(v) {
    v.append(switchRow('Require clinician review', 'Only clinician-reviewed entries may be shown. Every entry is currently an unreviewed draft, so turning this on shows nothing.', S.review, (on) => { S.review = on; }));
    v.append(el('div', { class: 'box' }, el('h3', { text: 'About' }), el('div', { class: 'muted', text: 'Matches people to assistive tools and everyday workarounds using the Person-Environment-Occupation model. It supports compensation and adaptation, not rehabilitation. Thresholds are engineering placeholders. Decision support only.' })));
    const ex = el('select', { class: 'sel', 'aria-label': 'Load an example', onchange: (e) => { if (!e.target.value) return; S.profile = clone(EXAMPLES[e.target.value]); S.onboarded = true; S.saved = []; tab('home'); } }, el('option', { value: '', text: 'Load an example profile (replaces your answers)' }), ...Object.entries(EXAMPLES).map(([k, p]) => el('option', { value: k, text: p.person.label })));
    v.append(el('div', { class: 'sec' }, el('div', { class: 'label', text: 'Try an example' }), ex));
    const reset = el('button', { class: 'btn ghost', text: S.confirmReset ? 'Tap again to erase everything' : 'Erase my answers and start over' });
    reset.addEventListener('click', () => { if (!S.confirmReset) { S.confirmReset = true; reset.textContent = 'Tap again to erase everything'; return; } S.confirmReset = false; S.profile = blank(); S.saved = []; S.onboarded = false; S.step = 0; S.stack = [{ page: 'onboard' }]; render(); });
    v.append(reset);
  },
};
load(); render();
</script>
